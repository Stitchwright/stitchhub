# OFF by default. The nightly Claude run (docs/claude-queue.md, "Routine 1") as a GitHub Actions fallback: it runs by hand,
# and on its schedule only when the repository variable CLAUDE_NIGHTLY_ENABLED is "true". Do not enable it together with the
# Claude Code routine of the same name. Needs the Claude GitHub app on the repository and the secret ANTHROPIC_API_KEY.
# NOT YET RUN: try it with "Run workflow" before turning the schedule on. Before enabling, pin the action to a commit SHA.
name: Claude nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"   # 2:30 a.m. US Eastern in summer; GitHub cron is UTC (3:30 a.m. in winter)

jobs:
  nightly:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CLAUDE_NIGHTLY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Follow docs/claude-queue.md, "Routine 1", for this repository (Stitchwright/stitchhub): read CLAUDE.md and PROGRESS.md; take the highest-priority oldest open issue labelled claude-queue and not integration (skip claude-working and claude-blocked) and do only that one; otherwise do maintenance mode as written there. One pull request at most. Never merge, never push to main, never force-push, and do not change workflow files.
          claude_args: >-
            --max-turns 60
            --allowedTools "Bash(npm run:*),Bash(npm test:*),Bash(npx tsc:*),Bash(node --check:*),Bash(git:*),Bash(gh issue:*),Bash(gh pr:*),Bash(gh label:*)"
